name: ساخت خودکار فایل خروجی ویندوز (Tauri Desktop EXE)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # امکان اجرای دستی در هر زمان با زدن دکمه Run workflow در تب Actions گیت‌هاب

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: دریافت کدهای پروژه (Checkout)
        uses: actions/checkout@v4

      - name: نصب محیط Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: راه‌اندازی کامپایلر Rust
        uses: dtolnay/rust-toolchain@stable

      - name: نصب وابستگی‌های پکیج‌ها
        run: npm install --legacy-peer-deps

      - name: بیلد خودکار نرم‌افزار دسکتاپ با Tauri
        run: npm run tauri:build

      - name: آپلود فایل‌های اجرایی جهت دانلود (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ClinicManagement-Windows-EXE
          path: |
            src-tauri/target/release/ClinicManagement.exe
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: warn
